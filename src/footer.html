<!DOCTYPE html>

    <style>
      .footer {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      a {
        color: rgb(255, 255, 255);
        margin: 1vw;
        font-family: "Franklin Gothic Medium", Arial, sans-serif;
      }

      a:hover {
        color: rgb(188, 188, 188);
      }

      a:active {
        color: rgb(128, 128, 128);
      }

      img {
        width: auto;
        max-height: 2.5vh;
        background: black;
        padding: 5px;
        border-radius: 10px;
      }

      /*add media query at 1000 width*/
      .footer {
        font-size: 15px;
      }
      @media screen and (max-width: 833px) {
        .footer {
          font-size: 13px;
        }
        .disc {
          height: 29px; 
          width: auto;
        }
      }

      @media screen and (max-width: 742px) {

          width: auto;

          height: 10px; 
          width: auto;

      @media screen and (max-width: 600px) {

          font-size: 9px;
        }

          width: auto;
        }
      }
      @media screen and (max-width: 550px) {

          height: 8px; 
          width: auto;

        .footer {
          font-size: 7px;

          height: 10px; 
          width: auto;

      @media screen and (max-width: 450px) {
